name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0

  test:
    strategy:
      matrix:
        include:
          - go-version-file: go.mod
          - go-version: stable
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: kanna
          POSTGRES_PASSWORD: kanna
          POSTGRES_DB: kanna_orm
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U kanna -d kanna_orm"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      mysql:
        image: mysql:8.4.13@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
        env:
          MYSQL_ROOT_PASSWORD: kanna
          MYSQL_USER: kanna
          MYSQL_PASSWORD: kanna
          MYSQL_DATABASE: kanna_orm
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ukanna -pkanna"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ matrix.go-version-file }}
          go-version: ${{ matrix.go-version }}

      - name: Run tests, against the databases too
        run: make test-db

      - name: Upload coverage to Codecov
        if: matrix.go-version-file == 'go.mod'
        uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

  example:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: kanna
          POSTGRES_PASSWORD: kanna
          POSTGRES_DB: kanna_orm
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U kanna -d kanna_orm"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      mysql:
        image: mysql:8.4.13@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
        env:
          MYSQL_ROOT_PASSWORD: kanna
          MYSQL_USER: kanna
          MYSQL_PASSWORD: kanna
          MYSQL_DATABASE: kanna_orm
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ukanna -pkanna"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Migrate and describe the databases, regenerate the example, and run it
        run: make example

      - name: Check the example is up to date
        run: |
          if [ -n "$(git status --porcelain -- example)" ]; then
            echo "::error::the example is stale; run 'make example' and commit the result"
            git status --porcelain -- example
            git diff -- example
            exit 1
          fi

  bench:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: kanna
          POSTGRES_PASSWORD: kanna
          POSTGRES_DB: kanna_orm
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U kanna -d kanna_orm"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      # The numbers of a shared runner say nothing; this checks only that every benchmark still runs. The database is
      # the service's, so the benchmarks run here rather than in the container of make bench.
      - name: Fill the database, regenerate the benchmarks of kanna-orm, check them, and run each once
        run: make bench-local BENCH_FLAGS='-benchtime=1x -benchmem'

      - name: Check the benchmarks are up to date
        run: |
          if [ -n "$(git status --porcelain -- bench)" ]; then
            echo "::error::the benchmarks are stale; run 'make bench' and commit the result"
            git status --porcelain -- bench
            git diff -- bench
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Run build
        run: make build
