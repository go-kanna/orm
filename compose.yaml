services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: kanna
      POSTGRES_PASSWORD: kanna
      POSTGRES_DB: kanna_orm
    ports:
      - "127.0.0.1:15432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kanna -d kanna_orm" ]
      interval: 2s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8.4.13@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
    environment:
      MYSQL_ROOT_PASSWORD: kanna
      MYSQL_USER: kanna
      MYSQL_PASSWORD: kanna
      MYSQL_DATABASE: kanna_orm
    ports:
      - "127.0.0.1:13306:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ukanna", "-pkanna" ]
      interval: 2s
      timeout: 5s
      retries: 30

  bench:
    image: golang:1.26.9@sha256:37cfcca63222ec499bec5e8ad7aad52dbf7529db36d5812b8eae2f0621aa92d6
    profiles: [ bench ]
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /src
    volumes:
      - .:/src
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build

volumes:
  go-mod:
  go-build:
